name: exam-app 배포 (GitHub Pages)
on:
  push:
    branches: [main]
    paths: ['exam-app/**', '.github/workflows/exam-app-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: exam-app/package-lock.json }
      - run: npm ci && npm run build
        working-directory: exam-app
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: exam-app/dist }
      - id: deployment
        uses: actions/deploy-pages@v4
